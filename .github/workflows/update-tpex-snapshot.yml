name: Update TPEX Snapshot

on:
  schedule:
    # TPEX publishes the day's data at ~20:00 Asia/Taipei (12:00 UTC);
    # 20:30 is the main run, 23:00 a retry in case the first was early/late.
    - cron: '30 12 * * 1-5'
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tpex-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest TPEX off-market snapshot
        run: |
          mkdir -p public/data
          curl -sSf --retry 3 --retry-delay 10 \
            "https://www.tpex.org.tw/openapi/v1/tpex_off_market" -o /tmp/tpex_off_market.json
          # Only replace the snapshot with a non-empty JSON array.
          jq -e 'type == "array" and length > 0' /tmp/tpex_off_market.json > /dev/null
          mv /tmp/tpex_off_market.json public/data/tpex_off_market.json

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/tpex_off_market.json; then
            echo "No snapshot changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tpex_off_market.json
          git commit -m "chore: update TPEX off-market snapshot"
          git pull --rebase
          git push
          # Pushes made with GITHUB_TOKEN do not trigger deploy.yml's push
          # event, so start the deploy explicitly. Without this the deployed
          # snapshot only refreshed when someone else pushed to main.
          gh workflow run deploy.yml --ref main
